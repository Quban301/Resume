<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guestbook Moderation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f3f1e7'/%3E%3Ctext x='32' y='43' font-family='monospace' font-size='30' font-weight='700' text-anchor='middle' fill='%232f8f4e'%3EQM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    [hidden] {
      display: none !important;
    }
    body {
      min-height: 100vh;
      padding: 32px clamp(16px, 4vw, 48px) 80px;
    }
    .ga {
      max-width: 880px;
      margin: 0 auto;
    }
    .ga-top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .ga-top h1 {
      font: 700 clamp(1.6rem, 4vw, 2.2rem) var(--font-display);
      margin: 0 auto 0 0;
    }
    .ga-top a,
    .ga button {
      font-family: inherit;
    }
    .ga .btn {
      padding: 9px 16px;
      font-size: .88rem;
      cursor: pointer;
    }
    .ga .btn[disabled] {
      opacity: .5;
      cursor: default;
    }
    .ga .danger {
      border-color: color-mix(in srgb, #e5484d 55%, var(--border));
      color: #e5484d;
    }
    .ga .danger:hover {
      background: color-mix(in srgb, #e5484d 14%, transparent);
      border-color: #e5484d;
    }
    .ga-card,
    .ga-login {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      backdrop-filter: blur(6px);
    }
    .ga-login {
      max-width: 420px;
      margin: 8vh auto 0;
      display: grid;
      gap: 14px;
    }
    .ga-login h2 {
      margin: 0;
      font: 700 1.4rem var(--font-display);
    }
    .ga-login p {
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
    }
    .ga label {
      display: grid;
      gap: 6px;
      font: 500 .78rem var(--font-mono);
      color: var(--muted);
    }
    .ga input[type=email],
    .ga input[type=password],
    .ga input[type=text],
    .ga textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-2);
      color: var(--text);
      font: 400 .95rem var(--font-body);
    }
    .ga input:focus,
    .ga textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .ga textarea {
      resize: vertical;
      min-height: 84px;
    }
    .ga-msg {
      min-height: 1.3em;
      font: 500 .85rem var(--font-mono);
      color: var(--muted);
    }
    .ga-msg.err {
      color: #e5484d;
    }
    .ga-msg.ok {
      color: var(--accent);
    }
    .ga-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .ga-tabs button {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font: 600 .85rem var(--font-mono);
      cursor: pointer;
    }
    .ga-tabs button[aria-pressed="true"] {
      color: var(--text);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, transparent);
    }
    .ga-list {
      display: grid;
      gap: 14px;
    }
    .ga-note {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 6px 16px;
    }
    .ga-mood {
      font-size: 1.6rem;
      line-height: 1;
      padding-top: 2px;
    }
    .ga-body p {
      margin: 0 0 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ga-by {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      font: 500 .8rem var(--font-mono);
      color: var(--muted);
      margin-bottom: 14px;
    }
    .ga-by b {
      color: var(--text);
      font-weight: 700;
    }
    .ga-badge {
      padding: 2px 9px;
      border-radius: 999px;
      font: 600 .7rem var(--font-mono);
      border: 1px solid var(--border);
    }
    .ga-badge.pending {
      color: #d9a521;
      border-color: color-mix(in srgb, #d9a521 55%, transparent);
    }
    .ga-badge.live {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    }
    .ga-badge.link {
      color: #e5484d;
      border-color: color-mix(in srgb, #e5484d 55%, transparent);
    }
    .ga-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ga-edit {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }
    .ga-empty {
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
    }
    @media (max-width: 520px) {
      .ga-note {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="ga">
    <header class="ga-top">
      <h1>Guestbook moderation</h1>
      <a class="btn btn-ghost" href="../#guestbook">Back to the site</a>
      <button class="btn btn-ghost" id="theme" type="button">Theme</button>
      <button class="btn btn-ghost" id="signout" type="button" hidden>Sign out</button>
    </header>

    <form class="ga-login" id="login" hidden autocomplete="on">
      <h2>Sign in</h2>
      <p>Only the site owner can approve, edit or delete notes.</p>
      <label>Email <input id="email" type="email" required autocomplete="username"></label>
      <label>Password <input id="pw" type="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <div class="ga-msg" id="loginMsg" role="status"></div>
    </form>

    <main id="dash" hidden>
      <div class="ga-tabs" id="tabs" role="group" aria-label="Filter notes"></div>
      <div class="ga-msg" id="dashMsg" role="status"></div>
      <div class="ga-list" id="list"></div>
    </main>

    <div class="ga-card" id="setup" hidden></div>
  </div>

  <script src="../js/data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
